<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | CineScope</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <header>
        <h1>CineScope</h1>
    </header>

    <main>
        <div class="profile-container">
            <h2>Профиль пользователя</h2>
            <div class="profile-info">
                <p><strong>Имя:</strong> <span id="username">Имя пользователя</span></p>
                <p><strong>Электронная почта:</strong> <span id="email">email@example.com</span></p>
            </div>

            <!-- Кнопки для выхода и перехода на главную -->
            <button id="logout-btn">Выйти из аккаунта</button>
            <button id="home-btn">На главную</button>
        </div>
    </main>

    <footer>
        <p>&copy; Maksims Goldmann, Timofejs Kravčuks P2-4 2025</p>
        <p>CineScope - лучший каталог фильмов</p>
    </footer>

    <script src="profile.js"></script>
</body>
</html>
